name: Daily Update

# Roz raat 12 baje PKT (19:00 UTC) par khud chalta hai.
# Pehli push par bhi chalta hai, taake site par foran asli data aa jaye.
# Haath se chalane ke liye: GitHub repo -> Actions -> Daily Update -> Run workflow.
on:
  schedule:
    - cron: "0 19 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - "cities.json"
      - "config.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daily data update
        run: python3 scripts/update.py

      - name: Changes ko commit aur push karen
        run: |
          git config user.name "daily-update-bot"
          git config user.email "daily-update-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%F)"
          git push
